name: Test

on:
  push:
    branches: [main, "claude/**", "ccr-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unit tests, the PROTOCOL.md example checks and the C/JS constant check.
      - name: make test
        run: make test
